version: '3.8'

services:
  qivropay-payments:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qivropay-payments-app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CASHFREE_APP_ID=${CASHFREE_APP_ID:-TEST110559449949df01b9dff3b901f544955011}
      - CASHFREE_SECRET_KEY=${CASHFREE_SECRET_KEY}
      - CASHFREE_ENV=${CASHFREE_ENV:-TEST}
      - QIVROPAY_WEBHOOK_SECRET=${QIVROPAY_WEBHOOK_SECRET:-whsec_qivropay_prod_991820}
      - HOSTNAME=0.0.0.0
    volumes:
      - ./server/db.json:/app/server/db.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: qivropay-network
